[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econode"
version = "2.1.0"
description = "Multi-Agent Carbon Intelligence Engine"
authors = [{name = "PromptWars Participant"}]
dependencies = [
    "streamlit>=1.30.0",
    "google-generativeai>=0.4.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=."
testpaths = [
    "tests",
]
