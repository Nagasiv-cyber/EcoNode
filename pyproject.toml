[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", ".github/*"]

[tool.ruff]
line-length = 300

[tool.ruff.lint]
select = ["F"]
ignore = ["F401", "F811"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
