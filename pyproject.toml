[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*", ".github/*", "app.py", "ui.py"]

[tool.coverage.report]
omit = ["tests/*", ".github/*", "app.py", "ui.py"]
fail_under = 80

[tool.ruff]
line-length = 300

[tool.ruff.lint]
select = ["F"]
ignore = ["F401", "F811"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110"]
