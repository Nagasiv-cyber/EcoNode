[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["tests/*", ".github/*"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
